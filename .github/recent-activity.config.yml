# Configuration for Readme-Workflows/recent-activity
# https://github.com/Readme-Workflows/recent-activity/wiki/Configuration

MAX_LINES: 5

# Filter out PushEvent to avoid the upstream 'undefined commit(s)' bug
# and filter minor/noisy events for a clean, professional activity feed
DISABLED_EVENTS:
  - PushEvent
  - GollumEvent
  - MemberEvent
  - CommitCommentEvent
  - PullRequestReviewCommentEvent
